services:
  # Backend Service
  - type: web
    name: epap-backend
    env: node
    repo: https://github.com/yourusername/employee-performance-appraisal-portal.git
    rootDir: server
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: epap-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CLIENT_URL
        value: https://your-app-name.onrender.com
    healthCheckPath: /api/health

  # Frontend Service
  - type: web
    name: epap-frontend
    env: static
    repo: https://github.com/yourusername/employee-performance-appraisal-portal.git
    rootDir: client
    buildCommand: "npm run build"
    publishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://epap-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://epap-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: epap-db
    databaseName: epap
    user: epap_user
